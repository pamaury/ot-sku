name: Create pre-signing release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      release_notes:
        description: GitHub release notes
        required: true
        type: string
      release_title:
        description: GitHub release title
        required: true
        type: string
      ref:
        description: Git branch or commit hash to checkout (ot-sku)
        required: true
        type: string
        default: main
      ot_repo:
        description: Opentitan repository to checkout
        type: string
        default: lowRISC/opentitan
      ot_ref:
        description: Git branch or commit hash to checkout (opentitan)
        type: string
        default: earlgrey_1.0.0

jobs:
  release:
    permissions:
      # Necessary permission to create a release:
      contents: write
    # Note: use the same runner as OpenTitan (see below).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (ot-sku)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: ot-sku

      # Also checkout OT repository
      - name: Checkout (opentitan)
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ot_repo }}
          ref: ${{ inputs.ot_ref }}
          fetch-depth: 0 # Bitstream cache requires all commits.
          path: opentitan

      # Install system dependencies from OpenTitan. Those are setup for Ubuntu 22.04.
      - name: Install system dependencies
        run: |
          sudo apt update
          grep '^[^#]' apt-requirements.txt | xargs sudo apt install -y
        working-directory: opentitan

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ot-sku/scripts/release.py \
            --verbose \
            --gha-console \
            --pre-sign \
            --ot-repo opentitan \
            --release-title "${{ inputs.release_title }}" \
            --release-notes "${{ inputs.release_notes }}" \
            "${{ inputs.release_tag }}"
